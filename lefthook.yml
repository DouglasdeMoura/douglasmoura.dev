pre-commit:
  parallel: true
  jobs:
    - name: ultracite fix
      glob: "*.{js,ts,jsx,tsx,mjs,mts,cjs,cts}"
      run: pnpm exec ultracite fix {staged_files}
      stage_fixed: true

    - name: update post timestamps
      glob: "content/posts/**/*.md"
      run: |
        NOW=$(date -u +"%Y-%m-%d %H:%M:%S.000Z")
        for f in {staged_files}; do
          sed -i "s/^updated:.*$/updated: $NOW/" "$f"
        done
      stage_fixed: true

    - name: generate resume pdf
      glob: "{src/app/lib/resume.json,cli/commands/resume/*}"
      # stage_fixed only re-stages glob-matched files, so add the PDF explicitly
      run: pnpm cli resume pdf && git add public/resume.pdf

    - name: update humans.txt
      run: |
        sed -i "s/^Last update:.*$/Last update: $(date -u +%Y-%m-%d)/" public/humans.txt
      stage_fixed: true

    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm tsc --noEmit

    - name: i18n check
      glob: "*.{ts,tsx}"
      run: pnpm cli i18n extract --check {staged_files}
